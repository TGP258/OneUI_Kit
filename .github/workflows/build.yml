name: Build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Assemble library and sample
        run: ./gradlew :oneui-kit:assembleDebug :sample:assembleDebug --no-daemon

      - name: Upload sample APK
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug
          path: sample/build/outputs/apk/debug/*.apk
          if-no-files-found: error
